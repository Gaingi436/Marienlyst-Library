<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Catalog</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        input,
        select {
            padding: 10px;
            font-size: 16px;
        }

        #searchText {
            flex: 1;
            min-width: 250px;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
        }

        .book-card {
            border: 1px solid #cccccc;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            background-color: #f9f9f9;
        }

        .book-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .book-title {
            font-size: 22px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        td,
        th {
            border: 1px solid #dddddd;
            padding: 8px;
        }

        th {
            background-color: #eeeeee;
            width: 220px;
            text-align: left;
        }

        .admin-panel {
            padding: 10px;
            border: 1px solid #cccccc;
            background: #fffff0;
            margin-bottom: 20px;
        }

        .delete-btn {
            background: #cc0000;
            color: white;
            border: none;
        }

        .import-btn {
            background: #0066cc;
            color: white;
            border: none;
        }

        .info-box {
            background: #f4f4f4;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

    </style>

</head>

<body>

    <h1>📚 Library Catalog</h1>

    <div id="accessPanel">

        <input
            type="password"
            id="accessCode"
            placeholder="Library Access Code">

        <button onclick="unlockAdmin()">
            Access
        </button>

    </div>

    <div
        id="adminPanel"
        class="admin-panel"
        style="display:none">

        <strong>Administrator Mode</strong>

        <br><br>

        <input
            type="file"
            id="csvFile"
            accept=".csv">

        <button
            class="import-btn"
            onclick="importCsv()">
            Import CSV
        </button>

    </div>

    <div class="toolbar">

        <input
            type="text"
            id="searchText"
            placeholder="Search by title or author">

        <select id="languageFilter">
            <option value="">All Languages</option>
        </select>

        <select id="sortBy">
            <option value="title">Sort: Title</option>
            <option value="author">Sort: Author</option>
            <option value="language">Sort: Language</option>
            <option value="section">Sort: Section</option>
        </select>

    </div>

    <div id="bookCount" class="info-box"></div>

    <div id="results"></div>

    <script>

        let isAdmin = false;

        const supabaseUrl =
            "https://baixuvdynobyomwpklmr.supabase.co";

        const supabaseKey =
            "YOUR_ANON_KEY_HERE";

        const client =
            supabase.createClient(
                supabaseUrl,
                supabaseKey
            );

        function unlockAdmin() {

            const code =
                document.getElementById(
                    "accessCode"
                ).value;

            if (code === "MSMK") {

                isAdmin = true;

                document.getElementById(
                    "accessPanel"
                ).style.display = "none";

                document.getElementById(
                    "adminPanel"
                ).style.display = "block";

                searchBooks();

            } else {

                alert(
                    "Invalid Access Code"
                );
            }
        }

        async function loadLanguages() {

            const { data, error } =
                await client
                    .from("Books1")
                    .select("language");

            if (error) {
                return;
            }

            const select =
                document.getElementById(
                    "languageFilter"
                );

            const languages =
                [...new Set(
                    data
                        .map(x => x.language)
                        .filter(x => x)
                )]
                .sort();

            languages.forEach(language => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    language;

                option.textContent =
                    language;

                select.appendChild(option);

            });
        }

        async function searchBooks() {

            const searchText =
                document
                    .getElementById(
                        "searchText"
                    )
                    .value
                    .trim();

            const language =
                document
                    .getElementById(
                        "languageFilter"
                    )
                    .value;

            const sortBy =
                document
                    .getElementById(
                        "sortBy"
                    )
                    .value;

            let query =
                client
                    .from("Books1")
                    .select("*");

            if (searchText !== "") {

                query = query.or(
                    `title.ilike.%${searchText}%,author.ilike.%${searchText}%`
                );
            }

            if (language !== "") {

                query =
                    query.eq(
                        "language",
                        language
                    );
            }

            query =
                query.order(
                    sortBy,
                    {
                        ascending: true
                    }
                );

            const { data, error } =
                await query;

            const results =
                document.getElementById(
                    "results"
                );

            if (error) {

                results.innerHTML =
                    "<div class='info-box'>Error: "
                    + error.message +
                    "</div>";

                return;
            }

            document.getElementById(
                "bookCount"
            ).innerHTML =
                "Books found: "
                + data.length;

            if (data.length === 0) {

                results.innerHTML =
                    "<div class='info-box'>No books found.</div>";

                return;
            }

            let html = "";

            data.forEach(book => {

                html += `
                    <div class="book-card">

                        <div class="book-header">

                            <div class="book-title">
                                ${book.title || ""}
                            </div>

                            ${
                                isAdmin
                                ?
                                `<button
                                    class="delete-btn"
                                    onclick="deleteBook(${book.id})">
                                    Delete
                                </button>`
                                :
                                ""
                            }

                        </div>

                        <table>

                            <tr>
                                <th>ID</th>
                                <td>${book.id || ""}</td>
                            </tr>

                            <tr>
                                <th>Author</th>
                                <td>${book.author || ""}</td>
                            </tr>

                            <tr>
                                <th>Language</th>
                                <td>${book.language || ""}</td>
                            </tr>

                            <tr>
                                <th>Section</th>
                                <td>${book.section || ""}</td>
                            </tr>

                            <tr>
                                <th>ISBN</th>
                                <td>${book.isbn || ""}</td>
                            </tr>

                            <tr>
                                <th>Notes</th>
                                <td>${book.notes || ""}</td>
                            </tr>

                        </table>

                    </div>
                `;
            });

            results.innerHTML = html;
        }

        async function deleteBook(id) {

            if (
                !confirm(
                    "Delete this book?"
                )
            ) {
                return;
            }

            const { error } =
                await client
                    .from("Books1")
                    .delete()
                    .eq("id", id);

            if (error) {

                alert(
                    error.message
                );

                return;
            }

            searchBooks();
        }

        async function importCsv() {

            const file =
                document
                    .getElementById(
                        "csvFile"
                    )
                    .files[0];

            if (!file) {

                alert(
                    "Select a CSV file"
                );

                return;
            }

            const text =
                await file.text();

            const rows =
                text
                    .split(/\r?\n/)
                    .filter(
                        r => r.trim() !== ""
                    );

            const books = [];

            for (
                let i = 0;
                i < rows.length;
                i++
            ) {

                const values =
                    rows[i].split(",");

                books.push({

                    title:
                        values[0] || null,

                    author:
                        values[1] || null,

                    language:
                        values[2] || null,

                    section:
                        values[3] || null,

                    isbn:
                        values[4] || null,

                    notes:
                        values[5] || null

                });

            }

            const { error } =
                await client
                    .from("Books1")
                    .insert(books);

            if (error) {

                alert(
                    error.message
                );

                return;
            }

            alert(
                books.length +
                " books imported"
            );

            await loadLanguages();
            searchBooks();
        }

        document
            .getElementById(
                "searchText"
            )
            .addEventListener(
                "input",
                searchBooks
            );

        document
            .getElementById(
                "languageFilter"
            )
            .addEventListener(
                "change",
                searchBooks
            );

        document
            .getElementById(
                "sortBy"
            )
            .addEventListener(
                "change",
                searchBooks
            );

        loadLanguages();
        searchBooks();

    </script>

</body>

</html>
