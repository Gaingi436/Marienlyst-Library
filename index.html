<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Catalog</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        input,
        select {
            padding: 10px;
            font-size: 16px;
        }

        #searchText {
            flex: 1;
            min-width: 250px;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
        }

        .book-card {
            border: 1px solid #cccccc;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            background-color: #f9f9f9;
        }

        .book-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .book-title {
            font-size: 22px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        td,
        th {
            border: 1px solid #dddddd;
            padding: 8px;
        }

        th {
            background-color: #eeeeee;
            width: 220px;
            text-align: left;
        }

        .admin-panel {
            padding: 10px;
            border: 1px solid #cccccc;
            background: #fffff0;
            margin-bottom: 20px;
        }

        .delete-btn {
            background: #cc0000;
            color: white;
            border: none;
        }

        .import-btn {
            background: #0066cc;
            color: white;
            border: none;
        }

        .info-box {
            background: #f4f4f4;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

    </style>

</head>

<body>

    <h1>📚 Library Catalog</h1>

    <div id="accessPanel">

        <input
            type="password"
            id="accessCode"
            placeholder="Library Access Code">

        <button onclick="unlockAdmin()">
            Access
        </button>

    </div>

    <div
        id="adminPanel"
        class="admin-panel"
        style="display:none">

        <strong>Administrator Mode</strong>

        <br><br>

        <input
            type="file"
            id="csvFile"
            accept=".csv">

        <button
            class="import-btn"
            onclick="importCsv()">
            Import CSV
        </button>

    </div>

    <div class="toolbar">

        <input
            type="text"
            id="searchText"
            placeholder="Search by title or author">

        <select id="languageFilter">
            <option value="">All Languages</option>
        </select>

        <select id="sortBy">
            <option value="title">Sort: Title</option>
            <option value="author">Sort: Author</option>
            <option value="language">Sort: Language</option>
            <option value="section">Sort: Section</option>
        </select>

    </div>

    <div id="bookCount" class="info-box"></div>

    <div id="results"></div>
