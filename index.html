<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Catalog</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .top-bar {
            margin-bottom: 20px;
        }

        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            padding: 10px;
            font-size: 16px;
        }

        #searchText {
            flex: 1;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
        }

        .book-card {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            background-color: #f8f8f8;
        }

        .book-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .book-title {
            font-size: 22px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
        }

        th {
            background-color: #efefef;
            width: 220px;
            text-align: left;
        }

        .admin-panel {
            margin-top: 15px;
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            background: #fffff0;
        }

        .delete-btn {
            background-color: #c62828;
            color: white;
            border: 0;
        }

        .import-btn {
            background-color: #1565c0;
            color: white;
            border: 0;
        }

        .info {
            padding: 10px;
            background: #f1f1f1;
            border-radius: 5px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <h1>📚 Library Catalog</h1>

    <div id="accessPanel" class="top-bar">

        <input
            type="password"
            id="accessCode"
            placeholder="Library Access Code">

        <button onclick="unlockAdmin()">
            Access
        </button>

    </div>

    <div
        id="adminPanel"
        class="admin-panel"
        style="display:none;">

        <strong>Administrator Mode</strong>

        <br><br>

        <input
            type="file"
            id="csvFile"
            accept=".csv">

        <button
            class="import-btn"
            onclick="importCsv()">
            Import CSV
        </button>

    </div>

    <div class="search-container">

        <input
            id="searchText"
            type="text"
            placeholder="Search by title or author">

        <button onclick="searchBooks()">
            Search
        </button>

    </div>

    <div id="results"></div>

    <script>

        let isAdmin = false;

        const supabaseUrl =
            "https://baixuvdynobyomwpklmr.supabase.co";

        const supabaseKey =
            "YOUR_ANON_KEY_HERE";

        const client =
            supabase.createClient(
                supabaseUrl,
                supabaseKey
            );

        function unlockAdmin() {

            const code =
                document.getElementById("accessCode").value;

            if (code === "MSMK") {

                isAdmin = true;

                document.getElementById(
                    "accessPanel"
                ).style.display = "none";

                document.getElementById(
                    "adminPanel"
                ).style.display = "block";

                searchBooks();

            } else {

                alert("Invalid Access Code");
            }
        }

        async function searchBooks() {

            const searchText =
                document.getElementById("searchText")
                .value
                .trim();

            let query =
                client
                .from("Books1")
                .select("*");

            if (searchText !== "") {

                query = query.or(
                    `title.ilike.%${searchText}%,author.ilike.%${searchText}%`
                );
            }

            const { data, error } =
                await query.order(
                    "title",
                    { ascending: true }
                );

            const results =
                document.getElementById("results");

            if (error) {

                results.innerHTML =
                    `<div class="info">
                        Error: ${error.message}
                    </div>`;

                console.error(error);

                return;
            }

            if (!data || data.length === 0) {

                results.innerHTML =
                    `<div class="info">
                        No books found.
                    </div>`;

                return;
            }

            let html = "";

            data.forEach(book => {

                html += `
                    <div class="book-card">

                        <div class="book-header">

                            <div class="book-title">
                                ${book.title || ""}
                            </div>

                            ${isAdmin
                                ? `<button
                                    class="delete-btn"
                                    onclick="deleteBook(${book.id})">
                                    Delete
                                   </button>`
                                : ""
                              }

                        </div>

                        <table>

                            <tr>
                                <th>ID</th>
                                <td>${book.id || ""}</td>
                            </tr>

                            <tr>
                                <th>Author</th>
                                <td>${book.author || ""}</td>
                            </tr>

                            <tr>
                                <th>Language</th>
                                <td>${book.language || ""}</td>
                            </tr>

                            <tr>
                                <th>Section</th>
                                <td>${book.section || ""}</td>
                            </tr>

                            <tr>
                                <th>ISBN</th>
                                <td>${book.isbn || ""}</td>
                            </tr>

                            <tr>
                                <th>Notes</th>
                                <td>${book.notes || ""}</td>
                            </tr>

                        </table>

                    </div>
                `;
            });

            results.innerHTML = html;
        }

        async function deleteBook(id) {

            if (!confirm("Delete this book?")) {
                return;
            }

            const { error } =
                await client
                .from("Books1")
                .delete()
                .eq("id", id);

            if (error) {

                alert(error.message);
                return;
            }

            alert("Book deleted");

            searchBooks();
        }

        async function importCsv() {

            const file =
                document.getElementById("csvFile")
                .files[0];

            if (!file) {

                alert("Select a CSV file");
                return;
            }

            const text =
                await file.text();

            const rows =
                text
                .split(/\r?\n/)
                .filter(
                    row => row.trim() !== ""
                );

            const headers =
                rows[0]
                .split(",")
                .map(
                    h => h.trim()
                );

            const books = [];

            for (let i = 1; i < rows.length; i++) {

                const values =
                    rows[i].split(",");

                const book = {};

                headers.forEach((header, index) => {

                    if (header === "id") {
                        return;
                    }

                    book[header] =
                        values[index]
                        ? values[index].trim()
                        : null;
                });

                books.push(book);
            }

            const { error } =
                await client
                .from("Books1")
                .insert(books);

            if (error) {

                alert(error.message);
                console.error(error);
                return;
            }

            alert(
                books.length +
                " books imported successfully"
            );

            searchBooks();
        }

        searchBooks();

    </script>

</body>

</html>
