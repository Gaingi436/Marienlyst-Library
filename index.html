<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        .card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            background: #f8f8f8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #eee;
            width: 200px;
        }
    </style>
</head>

<body>

<h1>📚 Biblioteca</h1>

<div class="search-box">
    <input
        id="searchText"
        type="text"
        placeholder="Cerca per titolo o autore">
    <button onclick="searchBooks()">Cerca</button>
</div>

<div id="results"></div>

<script>

const supabaseUrl =
    "https://baixuvdynobyomwpklmr.supabase.co";

const supabaseKey =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJhaXh1dmR5bm9ieW9td3BrbG1yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyMzk3OTUsImV4cCI6MjEwNTgxNTc5NX0.Jg9QDyV9YvCo15P8cO5LuKjjdN_-KAdMrNGhTxKhsEg";

const client = supabase.createClient(
    supabaseUrl,
    supabaseKey
);

async function searchBooks() {

    const text =
        document.getElementById("searchText").value.trim();

    const resultsDiv =
        document.getElementById("results");

    resultsDiv.innerHTML = "Ricerca in corso...";

    let query = client
        .from("Books1")
        .select("*");

    if (text !== "") {
        query = query.or(
            `title.ilike.%${text}%,author.ilike.%${text}%`
        );
    }

    const { data, error } = await query;

    if (error) {
        resultsDiv.innerHTML =
            "<p>Errore: " + error.message + "</p>";
        return;
    }

    if (!data || data.length === 0) {
        resultsDiv.innerHTML =
            "<p>Nessun libro trovato.</p>";
        return;
    }

    let html = "";

    data.forEach(book => {

        html += `
            <div class="card">

                <h2>${book.title || ""}</h2>

                <table>

                    <tr>
                        <th>Autore</th>
                        <td>${book.author || ""}</td>
                    </tr>

                    <tr>
                        <th>Lingua</th>
                        <td>${book.language || ""}</td>
                    </tr>

                    <tr>
                        <th>Sezione</th>
                        <td>${book.section || ""}</td>
                    </tr>

                    <tr>
                        <th>ISBN</th>
                        <td>${book.isbn || ""}</td>
                    </tr>

                    <tr>
                        <th>Editore</th>
                        <td>${book.publisher || ""}</td>
                    </tr>

                    <tr>
                        <th>Anno</th>
                        <td>${book.publication_year || ""}</td>
                    </tr>

                    <tr>
                        <th>Genere</th>
                        <td>${book.genre || ""}</td>
                    </tr>

                    <tr>
                        <th>Copertina</th>
                        <td>${book.cover_url || ""}</td>
                    </tr>

                    <tr>
                        <th>Note</th>
                        <td>${book.notes || ""}</td>
                    </tr>

                </table>

            </div>
        `;
    });

    resultsDiv.innerHTML = html;
}

searchBooks();

</script>

</body>
</html>
