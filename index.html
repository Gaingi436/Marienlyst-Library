<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .book-card {
            border: 1px solid #cccccc;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            background-color: #f9f9f9;
        }

        .book-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #dddddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #eeeeee;
            width: 220px;
        }

        .message {
            margin-top: 20px;
            padding: 10px;
            background-color: #ffffe0;
            border: 1px solid #cccc99;
        }
    </style>
</head>
<body>

    <h1>📚 Biblioteca</h1>

    <div class="search-container">
        <input
            type="text"
            id="searchText"
            placeholder="Cerca per titolo o autore">
        <button onclick="searchBooks()">Cerca</button>
    </div>

    <div id="results"></div>

    <script>

        const supabaseUrl =
            "https://baixuvdynobyomwpklmr.supabase.co";

        const supabaseKey =
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJhaXh1dmR5bm9ieW9td3BrbG1yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyMzk3OTUsImV4cCI6MjEwNTgxNTc5NX0.Jg9QDyV9YvCo15P8cO5LuKjjdN_-KAdMrNGhTxKhsEg";

        const client =
            supabase.createClient(
                supabaseUrl,
                supabaseKey
            );

        async function searchBooks() {

            const searchText =
                document.getElementById("searchText")
                .value
                .trim();

            let query =
                client
                .from("Books1")
                .select("*");

            if (searchText !== "") {

                query = query.or(
                    "title.ilike.%" + searchText + "%," +
                    "author.ilike.%" + searchText + "%"
                );
            }

            const { data, error } = await query;

            const results =
                document.getElementById("results");

            if (error) {
                results.innerHTML =
                    "<div class='message'>Errore: "
                    + error.message +
                    "</div>";

                console.error(error);
                return;
            }

            if (!data || data.length === 0) {

                results.innerHTML =
                    "<div class='message'>Nessun libro trovato.</div>";

                return;
            }

            let html = "";

            data.forEach(function(book) {

                html += `
                    <div class="book-card">

                        <div class="book-title">
                            ${book.title || ""}
                        </div>

                        <table>

                            <tr>
                                <th>Autore</th>
                                <td>${book.author || ""}</td>
                            </tr>

                            <tr>
                                <th>Lingua</th>
                                <td>${book.language || ""}</td>
                            </tr>

                            <tr>
                                <th>Sezione</th>
                                <td>${book.section || ""}</td>
                            </tr>

                            <tr>
                                <th>ISBN</th>
                                <td>${book.isbn || ""}</td>
                            </tr>

                            <tr>
                                <th>Editore</th>
                                <td>${book.publisher || ""}</td>
                            </tr>

                            <tr>
                                <th>Anno pubblicazione</th>
                                <td>${book.publication_year || ""}</td>
                            </tr>

                            <tr>
                                <th>Genere</th>
                                <td>${book.genre || ""}</td>
                            </tr>

                            <tr>
                                <th>URL Copertina</th>
                                <td>${book.cover_url || ""}</td>
                            </tr>

                            <tr>
                                <th>Note</th>
                                <td>${book.notes || ""}</td>
                            </tr>

                        </table>

                    </div>
                `;
            });

            results.innerHTML = html;
        }

    </script>

</body>
</html>
